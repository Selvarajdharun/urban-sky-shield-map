<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>URBAN SKY SHIELD</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#071522;
}

body{
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

.header{
  height:76px;
  min-height:76px;
  background:#071522;
  color:white;
  display:flex;
  align-items:center;
  gap:14px;
  padding:9px 15px;
  z-index:9999;
  box-shadow:0 2px 12px rgba(0,0,0,.35);
}

.brand{
  font-size:20px;
  font-weight:800;
  letter-spacing:1px;
  white-space:nowrap;
}

.brand span{
  color:#43d9ff;
}

.search-area{
  flex:1;
  max-width:780px;
  display:flex;
  gap:7px;
}

.search-area input{
  flex:1;
  height:42px;
  border:none;
  outline:none;
  border-radius:21px;
  padding:0 17px;
  font-size:14px;
}

.btn{
  height:42px;
  border:none;
  border-radius:21px;
  padding:0 16px;
  cursor:pointer;
  font-weight:700;
  color:white;
  background:#08a9d8;
}

.btn:hover{
  background:#078db5;
}

.location-btn{
  background:#17304a;
  border:1px solid #3c5c78;
}

/* ================= MAP ================= */

#map{
  flex:1;
  width:100%;
  min-height:0;
  background:#dce7ee;
}

/* ================= LOCATION DOT ================= */

.location-dot{
  width:18px;
  height:18px;
  border-radius:50%;
  background:#1683ff;
  border:3px solid white;

  box-shadow:
    0 0 0 6px rgba(22,131,255,.20),
    0 2px 8px rgba(0,0,0,.45);
}

/* ================= LOCATION BUTTON ================= */

.location-control{
  background:white;
  width:42px;
  height:42px;
  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 2px 8px rgba(0,0,0,.3);

  cursor:pointer;
  font-size:20px;
}

.location-control:hover{
  background:#f2f2f2;
}

/* ================= STATUS PANEL ================= */

.status-control{
  background:rgba(7,21,34,.92);
  color:white;
  padding:8px 11px;
  border-radius:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.35);

  font-size:11px;
  line-height:16px;
}

.status-title{
  color:#43d9ff;
  font-weight:800;
  margin-bottom:2px;
}

/* ================= LEGEND ================= */

.legend{
  background:rgba(255,255,255,.97);

  padding:12px 14px;

  border-radius:10px;

  box-shadow:
    0 2px 12px rgba(0,0,0,.3);

  color:#17202a;

  font-size:12px;
  line-height:20px;
}

.legend-title{
  font-weight:800;
  font-size:14px;
  margin-bottom:5px;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:7px;
}

.legend-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  border:1px solid rgba(0,0,0,.25);
}

.legend-note{
  border-top:1px solid #ddd;

  margin-top:6px;
  padding-top:5px;

  font-size:10px;
  color:#555;
}

/* ================= DARK SKY MARKER ================= */

.darksky-marker{
  width:26px;
  height:26px;

  border-radius:50%;

  background:#1683ff;

  border:3px solid white;

  box-shadow:
    0 0 0 5px rgba(30,136,229,.20),
    0 2px 7px rgba(0,0,0,.35);

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-size:13px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .header{
    height:105px;
    min-height:105px;

    flex-wrap:wrap;

    padding:8px;
    gap:6px;
  }

  .brand{
    width:100%;
    font-size:17px;
  }

  .search-area{
    width:100%;
    max-width:none;
  }

  .search-area input{
    height:37px;
    min-width:0;
  }

  .btn{
    height:37px;
    padding:0 10px;
    font-size:11px;
  }

  .legend{
    font-size:10px;
    padding:9px;
  }

  .legend-title{
    font-size:12px;
  }

  .status-control{
    font-size:9px;
    line-height:13px;
  }
}

</style>
</head>


<body>

<!-- ================= HEADER ================= -->

<div class="header">

  <div class="brand">
    URBAN SKY <span>SHIELD</span>
  </div>

  <div class="search-area">

    <input
      id="searchBox"
      type="text"
      placeholder="Search Chennai, Madurai, Ooty..."
    >

    <button
      class="btn"
      onclick="searchPlace()"
    >
      SEARCH
    </button>

    <button
      class="btn location-btn"
      onclick="getMyLocation()"
    >
      📍 LOCATION
    </button>

  </div>

</div>


<!-- ================= MAP ================= -->

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   1. MAP
========================================================= */

const map = L.map("map",{

  zoomControl:false,

  minZoom:5,

  maxZoom:19

}).setView(

  [11.1271,78.6569],

  8

);


/* =========================================================
   2. NORMAL MAP
========================================================= */

const normalMap = L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:19,

    attribution:
      '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'

  }

);

normalMap.addTo(map);


/* =========================================================
   3. SATELLITE
========================================================= */

const satelliteMap = L.tileLayer(

  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

  {

    maxZoom:19,

    attribution:"Tiles &copy; Esri"

  }

);


/* =========================================================
   4. POLLUTION LAYER
========================================================= */

const pollutionLayer = L.layerGroup();


function addPollution(

  lat,
  lon,
  radius,
  color,
  place,
  level

){

  const circle = L.circle(

    [lat,lon],

    {

      radius:radius,

      color:color,

      fillColor:color,

      fillOpacity:.23,

      weight:2

    }

  );


  circle.bindPopup(`

    <div style="font-family:Arial">

      <div style="
        font-size:16px;
        font-weight:800;
        margin-bottom:7px;
      ">

        💡 ${place}

      </div>

      <b>Lighting Pressure:</b>
      ${level}

      <br><br>

      <b>Dark-sky planning:</b>
      ${
        level.includes("Very Low") ||
        level.includes("Low")
        ? "Potential area"
        : "Lighting management area"
      }

      <br><br>

      <small style="color:#555">

        Conceptual planning visualization.
        Not a ground-measured Bortle value.

      </small>

    </div>

  `);


  pollutionLayer.addLayer(circle);

}


/* =========================================================
   5. VERY HIGH
========================================================= */

addPollution(

  13.0827,
  80.2707,
  30000,
  "#e53935",
  "Chennai Metropolitan Region",
  "Very High"

);


addPollution(

  11.0168,
  76.9558,
  22000,
  "#e53935",
  "Coimbatore",
  "Very High"

);


addPollution(

  9.9252,
  78.1198,
  20000,
  "#e53935",
  "Madurai",
  "Very High"

);


addPollution(

  12.9165,
  79.1325,
  18000,
  "#e53935",
  "Vellore",
  "Very High"

);


/* =========================================================
   6. HIGH
========================================================= */

addPollution(

  10.7905,
  78.7047,
  18000,
  "#fb8c00",
  "Tiruchirappalli",
  "High"

);


addPollution(

  11.6643,
  78.1460,
  18000,
  "#fb8c00",
  "Salem",
  "High"

);


addPollution(

  10.7867,
  79.1378,
  15000,
  "#fb8c00",
  "Thanjavur",
  "High"

);


addPollution(

  8.7139,
  77.7567,
  15000,
  "#fb8c00",
  "Tirunelveli",
  "High"

);


addPollution(

  11.1085,
  77.3411,
  15000,
  "#fb8c00",
  "Tiruppur",
  "High"

);


/* =========================================================
   7. MODERATE
========================================================= */

addPollution(

  11.3410,
  77.7172,
  16000,
  "#fdd835",
  "Erode",
  "Moderate"

);


addPollution(

  10.9601,
  78.0766,
  14000,
  "#fdd835",
  "Karur",
  "Moderate"

);


addPollution(

  10.3624,
  77.9695,
  14000,
  "#fdd835",
  "Dindigul",
  "Moderate"

);


addPollution(

  9.2881,
  79.3129,
  15000,
  "#fdd835",
  "Ramanathapuram",
  "Moderate"

);


addPollution(

  8.7642,
  78.1348,
  15000,
  "#fdd835",
  "Thoothukudi",
  "Moderate"

);


/* =========================================================
   8. LOW
========================================================= */

addPollution(

  11.4102,
  76.6950,
  26000,
  "#43a047",
  "Nilgiris / Ooty",
  "Low"

);


addPollution(

  12.2253,
  79.0747,
  17000,
  "#43a047",
  "Tiruvannamalai",
  "Low"

);


addPollution(

  8.0883,
  77.5385,
  18000,
  "#43a047",
  "Kanyakumari Interior",
  "Low"

);


/* =========================================================
   9. VERY LOW / DARK SKY
========================================================= */

addPollution(

  11.45,
  76.40,
  35000,
  "#1e88e5",
  "Nilgiri Interior",
  "Very Low / Dark-sky potential"

);


addPollution(

  10.00,
  78.00,
  30000,
  "#1e88e5",
  "Southern Interior",
  "Very Low / Dark-sky potential"

);


addPollution(

  10.75,
  79.35,
  30000,
  "#1e88e5",
  "Delta Rural Region",
  "Very Low / Dark-sky potential"

);


pollutionLayer.addTo(map);


/* =========================================================
   10. DARK-SKY POTENTIAL MARKERS
========================================================= */

const darkSkyLayer = L.layerGroup();


function addDarkSky(

  lat,
  lon,
  name,
  description

){

  const icon = L.divIcon({

    className:"",

    html:
      '<div class="darksky-marker">★</div>',

    iconSize:[26,26],

    iconAnchor:[13,13]

  });


  const marker =
    L.marker(

      [lat,lon],

      {
        icon:icon
      }

    );


  marker.bindPopup(`

    <div style="font-family:Arial">

      <b style="
        font-size:16px;
        color:#1683ff;
      ">

        🌌 ${name}

      </b>

      <br><br>

      ${description}

      <br><br>

      <small>

        Dark-sky potential marker.
        Site suitability should be validated
        using actual night-sky observations.

      </small>

    </div>

  `);


  darkSkyLayer.addLayer(marker);

}


addDarkSky(

  11.4102,
  76.6950,

  "Nilgiris / Ooty",

  "Lower conceptual lighting-pressure area."

);


addDarkSky(

  12.2253,
  79.0747,

  "Tiruvannamalai",

  "Potential lower-light region."

);


addDarkSky(

  8.0883,
  77.5385,

  "Kanyakumari Interior",

  "Potential lower-light region."

);


darkSkyLayer.addTo(map);


/* =========================================================
   11. ZOOM CONTROL
========================================================= */

L.control.zoom({

  position:"topright"

}).addTo(map);


/* =========================================================
   12. LAYER CONTROL
========================================================= */

L.control.layers(

  {

    "🗺️ Normal Map":
      normalMap,

    "🛰️ Satellite":
      satelliteMap

  },

  {

    "💡 Light Pollution":
      pollutionLayer,

    "🌌 Dark-sky Potential":
      darkSkyLayer

  },

  {

    collapsed:false,

    position:"topright"

  }

).addTo(map);


/* =========================================================
   13. LEGEND
========================================================= */

const legend =
L.control({

  position:"bottomright"

});


legend.onAdd=function(){

  const div =
    L.DomUtil.create(
      "div",
      "legend"
    );


  div.innerHTML=`

    <div class="legend-title">
      💡 Light Pollution
    </div>

    <div class="legend-row">

      <span
        class="legend-dot"
        style="background:#e53935"
      ></span>

      Very High

    </div>

    <div class="legend-row">

      <span
        class="legend-dot"
        style="background:#fb8c00"
      ></span>

      High

    </div>

    <div class="legend-row">

      <span
        class="legend-dot"
        style="background:#fdd835"
      ></span>

      Moderate

    </div>

    <div class="legend-row">

      <span
        class="legend-dot"
        style="background:#43a047"
      ></span>

      Low

    </div>

    <div class="legend-row">

      <span
        class="legend-dot"
        style="background:#1e88e5"
      ></span>

      Very Low / Dark-sky

    </div>

    <div class="legend-note">

      Conceptual planning visualization

    </div>

  `;


  return div;

};


legend.addTo(map);


/* =========================================================
   14. SCALE
========================================================= */

L.control.scale({

  position:"bottomleft",

  imperial:false

}).addTo(map);


/* =========================================================
   15. LOCATION BUTTON
========================================================= */

const LocationControl =
L.Control.extend({

  options:{
    position:"topright"
  },


  onAdd:function(){

    const container =
      L.DomUtil.create(
        "div",
        "location-control"
      );


    container.innerHTML="📍";

    container.title=
      "Find my current location";


    container.onclick=
      function(){

        getMyLocation();

      };


    L.DomEvent.disableClickPropagation(
      container
    );


    return container;

  }

});


map.addControl(
  new LocationControl()
);


/* =========================================================
   16. STATUS PANEL
========================================================= */

const statusControl =
L.control({

  position:"topleft"

});


statusControl.onAdd=function(){

  const div =
    L.DomUtil.create(
      "div",
      "status-control"
    );


  div.id="mapStatus";


  div.innerHTML=`

    <div class="status-title">
      URBAN SKY SHIELD
    </div>

    Tamil Nadu

  `;


  return div;

};


statusControl.addTo(map);


/* =========================================================
   17. UPDATE MAP STATUS
========================================================= */

function updateStatus(){

  const center =
    map.getCenter();


  const zoom =
    map.getZoom();


  const status =
    document.getElementById(
      "mapStatus"
    );


  if(status){

    status.innerHTML=`

      <div class="status-title">
        URBAN SKY SHIELD
      </div>

      Lat:
      ${center.lat.toFixed(4)}

      <br>

      Lon:
      ${center.lng.toFixed(4)}

      <br>

      Zoom:
      ${zoom}

    `;

  }

}


map.on(
  "moveend",
  updateStatus
);

updateStatus();


/* =========================================================
   18. CURRENT LOCATION
========================================================= */

let currentMarker=null;

let accuracyCircle=null;


function getMyLocation(){

  if(!navigator.geolocation){

    alert(
      "Location is not supported by this browser."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;


      const lon =
        position.coords.longitude;


      const accuracy =
        position.coords.accuracy;


      map.setView(

        [lat,lon],

        17,

        {
          animate:true
        }

      );


      if(currentMarker){

        map.removeLayer(
          currentMarker
        );

      }


      if(accuracyCircle){

        map.removeLayer(
          accuracyCircle
        );

      }


      const icon =
        L.divIcon({

          className:"",

          html:
            '<div class="location-dot"></div>',

          iconSize:[
            18,
            18
          ],

          iconAnchor:[
            9,
            9
          ]

        });


      currentMarker =
        L.marker(

          [lat,lon],

          {
            icon:icon
          }

        )

        .addTo(map);


      accuracyCircle =
        L.circle(

          [lat,lon],

          {

            radius:accuracy,

            color:"#1683ff",

            fillColor:"#1683ff",

            fillOpacity:.12,

            weight:1

          }

        )

        .addTo(map);


      currentMarker

        .bindPopup(`

          <b>📍 Your Current Location</b>

          <br><br>

          GPS accuracy:
          approximately
          ${Math.round(accuracy)}
          metres

        `)

        .openPopup();


      reverseLocation(
        lat,
        lon
      );

    },


    function(error){

      if(error.code===1){

        alert(

          "Location permission denied.\n\n" +

          "Please allow Location permission " +

          "for Chrome and try again."

        );

      }

      else if(error.code===2){

        alert(
          "Location could not be determined."
        );

      }

      else if(error.code===3){

        alert(
          "Location request timed out. Try again."
        );

      }

    },


    {

      enableHighAccuracy:true,

      timeout:15000,

      maximumAge:0

    }

  );

}


/* =========================================================
   19. REVERSE LOCATION
========================================================= */

async function reverseLocation(

  lat,
  lon

){

  try{

    const response =
      await fetch(

        "https://nominatim.openstreetmap.org/reverse" +

        "?format=json" +

        "&lat="+
        encodeURIComponent(lat) +

        "&lon="+
        encodeURIComponent(lon) +

        "&zoom=18" +

        "&addressdetails=1"

      );


    const data =
      await response.json();


    if(

      currentMarker &&

      data &&

      data.address

    ){

      const address =
        data.address;


      const road =
        address.road ||

        address.pedestrian ||

        address.neighbourhood ||

        "Location";


      const city =
        address.city ||

        address.town ||

        address.village ||

        address.suburb ||

        "";


      currentMarker.bindPopup(`

        <b>📍 Current Location</b>

        <br><br>

        <b>${road}</b>

        <br>

        ${city}

        <br>

        ${address.state || "Tamil Nadu"}

      `);

    }

  }

  catch(error){

    console.log(
      "Reverse geocoding unavailable"
    );

  }

}


/* =========================================================
   20. SEARCH
========================================================= */

let searchMarker=null;


async function searchPlace(){

  const query =
    document

      .getElementById(
        "searchBox"
      )

      .value

      .trim();


  if(!query){

    alert(
      "Type a place name first."
    );

    return;

  }


  try{

    const response =
      await fetch(

        "https://nominatim.openstreetmap.org/search" +

        "?format=json" +

        "&q="+
        encodeURIComponent(query) +

        "&limit=1" +

        "&countrycodes=in"

      );


    const results =
      await response.json();


    if(!results.length){

      alert(
        "Location not found."
      );

      return;

    }


    const place =
      results[0];


    const lat =
      parseFloat(
        place.lat
      );


    const lon =
      parseFloat(
        place.lon
      );


    map.setView(

      [lat,lon],

      15,

      {
        animate:true
      }

    );


    if(searchMarker){

      map.removeLayer(
        searchMarker
      );

    }


    searchMarker =

      L.marker(
        [lat,lon]
      )

      .addTo(map)

      .bindPopup(`

        <b>🔎 Search Result</b>

        <br><br>

        ${place.display_name}

      `)

      .openPopup();

  }

  catch(error){

    alert(
      "Search service unavailable."
    );

    console.log(error);

  }

}


/* =========================================================
   21. ENTER KEY
========================================================= */

document

  .getElementById(
    "searchBox"
  )

  .addEventListener(

    "keydown",

    function(event){

      if(
        event.key==="Enter"
      ){

        searchPlace();

      }

    }

  );


/* =========================================================
   22. MAP RESIZE
========================================================= */

setTimeout(

  function(){

    map.invalidateSize();

  },

  500

);


window.addEventListener(

  "resize",

  function(){

    map.invalidateSize();

  }

);


console.log(
  "URBAN SKY SHIELD loaded successfully."
);

</script>

</body>
</html>
