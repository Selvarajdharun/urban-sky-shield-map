<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Urban Sky Shield</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#map{
  width:100%;
  height:100%;
}


/* =========================
   TOP
========================= */

.top-panel{
  position:absolute;
  z-index:2000;
  top:8px;
  left:8px;
  right:8px;
  max-width:720px;
  margin:auto;
}

.title-box{
  background:rgba(255,255,255,.97);
  padding:10px 14px;
  border-radius:16px;
  box-shadow:0 3px 14px rgba(0,0,0,.25);
  margin-bottom:7px;
}

.title{
  font-size:21px;
  font-weight:bold;
  color:#123b4a;
}


/* =========================
   SEARCH
========================= */

.search-row{
  display:flex;
  gap:7px;
}

.search-row input{
  flex:1;
  min-width:0;
  height:46px;
  border:0;
  border-radius:14px;
  padding:0 15px;
  font-size:15px;
  outline:none;
  box-shadow:0 3px 13px rgba(0,0,0,.25);
}

.search-btn,
.location-btn{
  height:46px;
  border:0;
  border-radius:14px;
  padding:0 15px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 3px 13px rgba(0,0,0,.25);
}

.search-btn{
  background:#087f9b;
  color:white;
}

.location-btn{
  background:white;
  color:#075c73;
}


/* =========================
   ICONS
========================= */

.map-icons{
  position:absolute;
  z-index:2000;
  right:12px;
  top:155px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.map-icon{
  width:48px;
  height:48px;
  border:0;
  border-radius:15px;
  background:#09233a;
  color:white;
  font-size:22px;
  box-shadow:0 3px 12px rgba(0,0,0,.35);
  cursor:pointer;
}


/* =========================
   LOCATION
========================= */

.locate-control{
  position:absolute;
  z-index:2000;
  right:12px;
  bottom:25px;
}

.locate-big{
  width:58px;
  height:58px;
  border:0;
  border-radius:18px;
  background:white;
  color:#1769ff;
  font-size:29px;
  box-shadow:0 4px 15px rgba(0,0,0,.30);
}


/* =========================
   GPS DOT
========================= */

.user-dot{
  width:22px;
  height:22px;
  background:#1769ff;
  border:4px solid white;
  border-radius:50%;
  box-shadow:
  0 0 0 6px rgba(23,105,255,.20),
  0 3px 12px rgba(0,0,0,.40);
}


/* =========================
   ZOOM
========================= */

.leaflet-control-zoom{
  margin-top:155px !important;
  margin-left:8px !important;
}

.leaflet-control-zoom a{
  width:42px !important;
  height:42px !important;
  line-height:42px !important;
  font-size:25px !important;
  background:white !important;
  color:#123b4a !important;
}


/* =========================
   LEGEND
========================= */

.legend{
  position:absolute;
  z-index:1500;
  left:12px;
  bottom:20px;

  background:rgba(255,255,255,.96);

  padding:12px 14px;

  border-radius:15px;

  box-shadow:
  0 3px 14px rgba(0,0,0,.28);

  font-size:12px;

  min-width:155px;
}

.legend-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:8px;
  color:#123b4a;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin:5px 0;
}

.legend-color{
  width:18px;
  height:18px;
  border-radius:5px;
}


/* =========================
   POPUP
========================= */

.location-popup{
  min-width:190px;
  font-family:Arial,sans-serif;
}

.heading{
  font-size:16px;
  font-weight:bold;
  color:#1769ff;
  margin-bottom:7px;
}

.street{
  font-size:14px;
  font-weight:bold;
  color:#222;
  line-height:1.45;
}

.accuracy{
  margin-top:6px;
  font-size:11px;
  color:#666;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .title{
    font-size:18px;
  }

  .search-row{
    flex-wrap:wrap;
  }

  .search-row input{
    width:100%;
    flex:none;
  }

  .search-btn,
  .location-btn{
    flex:1;
  }

  .map-icons{
    top:160px;
    right:9px;
  }

  .map-icon{
    width:45px;
    height:45px;
  }

  .legend{
    left:8px;
    bottom:12px;
    font-size:11px;
  }

}

</style>

</head>

<body>


<div id="map"></div>


<!-- =========================
     TOP PANEL
========================= -->

<div class="top-panel">

  <div class="title-box">

    <div class="title">
      🌌 URBAN SKY SHIELD
    </div>

  </div>


  <div class="search-row">

    <input
      id="searchBox"
      type="text"
      placeholder="Search Chennai, Madurai, Ooty..."
    >

    <button
      class="search-btn"
      onclick="searchPlace()">
      SEARCH
    </button>

    <button
      class="location-btn"
      onclick="startLocation()">
      📍 LOCATION
    </button>

  </div>

</div>


<!-- =========================
     ICONS
========================= -->

<div class="map-icons">

  <button
    class="map-icon"
    onclick="togglePollution()">
    🌈
  </button>

  <button
    class="map-icon"
    onclick="toggleSatellite()">
    🛰️
  </button>

  <button
    class="map-icon"
    onclick="startLocation()">
    ⦿
  </button>

</div>


<!-- =========================
     LOCATION
========================= -->

<div class="locate-control">

  <button
    class="locate-big"
    onclick="startLocation()">
    📍
  </button>

</div>


<!-- =========================
     LEGEND
========================= -->

<div class="legend">

  <div class="legend-title">
    LIGHT POLLUTION
  </div>

  <div class="legend-row">
    <span
      class="legend-color"
      style="background:#ff2020">
    </span>
    Very High
  </div>

  <div class="legend-row">
    <span
      class="legend-color"
      style="background:#ff7800">
    </span>
    High
  </div>

  <div class="legend-row">
    <span
      class="legend-color"
      style="background:#ffd000">
    </span>
    Moderate
  </div>

  <div class="legend-row">
    <span
      class="legend-color"
      style="background:#55c936">
    </span>
    Low
  </div>

  <div class="legend-row">
    <span
      class="legend-color"
      style="background:#168cff">
    </span>
    Very Low
  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   MAP
===================================================== */

const map = L.map("map",{

  zoomControl:true,
  minZoom:5,
  maxZoom:19

}).setView(

  [11.1271,78.6569],
  7

);


/* =====================================================
   STREET MAP
===================================================== */

const streetMap = L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {
    maxZoom:19,
    attribution:
    "&copy; OpenStreetMap contributors"
  }

);

streetMap.addTo(map);


/* =====================================================
   SATELLITE
===================================================== */

const satelliteMap = L.tileLayer(

  "https://server.arcgisonline.com/ArcGIS/rest/services/" +
  "World_Imagery/MapServer/tile/{z}/{y}/{x}",

  {
    maxZoom:19,
    attribution:"&copy; Esri"
  }

);


/* =====================================================
   POLLUTION GROUP
===================================================== */

const pollutionGroup = L.layerGroup();


/*
  PROPOSED LIGHT-POLLUTION ZONES

  These are visualization/planning zones.
  They are NOT direct ground measurements.
*/


/* =====================================================
   VERY HIGH ZONES
===================================================== */

const veryHigh = [

  [13.0827,80.2707,38000,"Chennai Metropolitan Region"],

  [12.9165,79.1325,18000,"Vellore"],

  [11.0168,76.9558,22000,"Coimbatore"],

  [9.9252,78.1198,20000,"Madurai"]

];


/* =====================================================
   HIGH ZONES
===================================================== */

const high = [

  [10.7905,78.7047,18000,"Tiruchirappalli"],

  [11.6643,78.1460,17000,"Salem"],

  [10.9601,79.3845,14000,"Kumbakonam"],

  [10.7870,79.1378,13000,"Thanjavur"],

  [8.7139,77.7567,13000,"Tirunelveli"],

  [11.1085,77.3411,12000,"Tiruppur"],

  [9.9399,78.1210,12000,"Madurai Urban"]

];


/* =====================================================
   MODERATE ZONES
===================================================== */

const moderate = [

  [11.3410,77.7172,17000,"Erode"],

  [11.2194,78.1670,15000,"Namakkal"],

  [11.2746,77.6070,13000,"Tiruchengode"],

  [10.7905,79.1378,10000,"Thanjavur Region"],

  [9.5916,80.0200,12000,"Ramanathapuram"],

  [9.2648,78.8381,12000,"Sivaganga"],

  [8.7642,78.1348,12000,"Thoothukudi"],

  [10.3624,77.9695,10000,"Dindigul"],

  [10.9601,78.0766,11000,"Karur"],

  [12.6819,79.9888,11000,"Kanchipuram"]

];


/* =====================================================
   LOW ZONES
===================================================== */

const low = [

  [11.4102,76.6950,18000,"Ooty / Nilgiris"],

  [12.2253,79.0747,13000,"Tiruvannamalai"],

  [11.7401,79.7684,13000,"Cuddalore Rural"],

  [11.7480,79.7714,12000,"Puducherry Region"],

  [10.5256,76.2133,14000,"Western Tamil Nadu"],

  [8.0883,77.5385,13000,"Kanyakumari Interior"],

  [9.2880,78.9988,12000,"Sivaganga Rural"]

];


/* =====================================================
   VERY LOW / DARK-SKY POTENTIAL
===================================================== */

const veryLow = [

  [11.5000,76.3000,22000,"Nilgiri Interior"],

  [10.3000,77.2000,18000,"Western Hill Region"],

  [9.1500,77.5000,18000,"Southern Interior"],

  [8.4500,77.3500,16000,"Southern Rural Region"],

  [10.9000,79.8000,16000,"Delta Rural Region"],

  [12.4500,78.5000,17000,"Northern Rural Region"],

  [9.7000,79.3000,18000,"Ramanathapuram Coastal Region"]

];


/* =====================================================
   DRAW ZONE FUNCTION
===================================================== */

function drawZones(

  zones,
  color,
  fillOpacity,
  level

){

  zones.forEach(function(zone){

    L.circle(

      [zone[0],zone[1]],

      {

        radius:zone[2],

        color:color,

        fillColor:color,

        fillOpacity:fillOpacity,

        weight:2

      }

    )

    .bindPopup(

      "<b>"+
      zone[3]+
      "</b><br><br>"+

      "<strong>"+
      level+
      "</strong>"+

      "<br><br>"+

      "<small>"+
      "Proposed light-pollution "+
      "planning zone — not direct "+
      "ground measurement."
      +
      "</small>"

    )

    .addTo(pollutionGroup);

  });

}


/* =====================================================
   DRAW ALL ZONES
===================================================== */

drawZones(
  veryHigh,
  "#ff2020",
  0.22,
  "VERY HIGH LIGHT POLLUTION"
);


drawZones(
  high,
  "#ff7800",
  0.20,
  "HIGH LIGHT POLLUTION"
);


drawZones(
  moderate,
  "#ffd000",
  0.18,
  "MODERATE LIGHT POLLUTION"
);


drawZones(
  low,
  "#55c936",
  0.16,
  "LOW LIGHT POLLUTION"
);


drawZones(
  veryLow,
  "#168cff",
  0.15,
  "VERY LOW / DARK-SKY POTENTIAL"
);


/* SHOW BY DEFAULT */

pollutionGroup.addTo(map);


/* =====================================================
   GPS
===================================================== */

let userMarker=null;

let accuracyCircle=null;

let locationWatch=null;

let firstGPSFix=false;


function startLocation(){


  if(!navigator.geolocation){

    alert(
      "Your browser does not support GPS location."
    );

    return;

  }


  if(locationWatch!==null){

    navigator.geolocation.clearWatch(
      locationWatch
    );

  }


  firstGPSFix=false;


  locationWatch=

  navigator.geolocation.watchPosition(

    function(position){

      const lat=
      position.coords.latitude;

      const lon=
      position.coords.longitude;

      const accuracy=
      position.coords.accuracy;


      if(userMarker){

        map.removeLayer(
          userMarker
        );

      }


      if(accuracyCircle){

        map.removeLayer(
          accuracyCircle
        );

      }


      userMarker=

      L.marker(

        [lat,lon],

        {

          icon:L.divIcon({

            className:"",

            html:
            '<div class="user-dot"></div>',

            iconSize:[22,22],

            iconAnchor:[11,11]

          })

        }

      ).addTo(map);


      accuracyCircle=

      L.circle(

        [lat,lon],

        {

          radius:accuracy,

          color:"#1769ff",

          fillColor:"#1769ff",

          fillOpacity:0.08,

          weight:2

        }

      ).addTo(map);


      if(!firstGPSFix){

        firstGPSFix=true;

        map.flyTo(

          [lat,lon],

          18,

          {
            duration:1.5
          }

        );

      }


      getStreetName(
        lat,
        lon,
        accuracy
      );

    },


    function(error){

      if(error.code===1){

        alert(

          "Location permission denied.\n\n"+
          "Please allow Precise Location "+
          "for this website."

        );

      }

      else if(error.code===2){

        alert(
          "Location unavailable. "+
          "Please turn ON GPS/Location."
        );

      }

      else{

        alert(
          "GPS timeout. Please try again."
        );

      }

    },


    {

      enableHighAccuracy:true,

      timeout:30000,

      maximumAge:0

    }

  );

}


/* =====================================================
   STREET NAME
===================================================== */

async function getStreetName(

  lat,
  lon,
  accuracy

){

  try{

    const url=

    "https://nominatim.openstreetmap.org/reverse"+
    "?format=json"+
    "&lat="+encodeURIComponent(lat)+
    "&lon="+encodeURIComponent(lon)+
    "&zoom=18"+
    "&addressdetails=1";


    const response=
    await fetch(url);


    const data=
    await response.json();


    const address=
    data.address || {};


    const road=

    address.road ||
    address.pedestrian ||
    address.residential ||
    address.footway ||
    address.path ||
    "Street name unavailable";


    const area=

    address.suburb ||
    address.neighbourhood ||
    address.village ||
    address.town ||
    "";


    const city=

    address.city ||
    address.town ||
    address.municipality ||
    address.village ||
    "";


    let text=road;


    if(area){

      text+="<br>"+area;

    }


    if(city && city!==area){

      text+="<br>"+city;

    }


    if(userMarker){

      userMarker

      .bindPopup(

        '<div class="location-popup">'+

        '<div class="heading">'+
        '📍 You are here'+
        '</div>'+

        '<div class="street">'+
        text+
        '</div>'+

        '<div class="accuracy">'+
        'GPS accuracy: approximately '+
        Math.round(accuracy)+
        ' m'+
        '</div>'+

        '</div>'

      )

      .openPopup();

    }


  }

  catch(error){

    console.log(
      "Street lookup failed:",
      error
    );

  }

}


/* =====================================================
   POLLUTION TOGGLE
===================================================== */

let pollutionVisible=true;


function togglePollution(){

  if(pollutionVisible){

    map.removeLayer(
      pollutionGroup
    );

    pollutionVisible=false;

  }

  else{

    pollutionGroup.addTo(map);

    pollutionVisible=true;

  }

}


/* =====================================================
   SATELLITE TOGGLE
===================================================== */

let satelliteVisible=false;


function toggleSatellite(){

  if(!satelliteVisible){

    map.removeLayer(
      streetMap
    );

    satelliteMap.addTo(map);

    satelliteVisible=true;

  }

  else{

    map.removeLayer(
      satelliteMap
    );

    streetMap.addTo(map);

    satelliteVisible=false;

  }

}


/* =====================================================
   SEARCH
===================================================== */

async function searchPlace(){

  const query=

  document
  .getElementById("searchBox")
  .value
  .trim();


  if(!query){

    alert(
      "Enter a place name."
    );

    return;

  }


  try{

    const url=

    "https://nominatim.openstreetmap.org/search"+
    "?format=json"+
    "&limit=1"+
    "&countrycodes=in"+
    "&q="+
    encodeURIComponent(query);


    const response=
    await fetch(url);


    const data=
    await response.json();


    if(!data.length){

      alert(
        "Location not found."
      );

      return;

    }


    const lat=
    parseFloat(data[0].lat);

    const lon=
    parseFloat(data[0].lon);


    map.flyTo(

      [lat,lon],

      17,

      {
        duration:1.3
      }

    );


    L.popup()

    .setLatLng(
      [lat,lon]
    )

    .setContent(

      "<b>"+
      data[0].display_name+
      "</b>"

    )

    .openOn(map);

  }


  catch(error){

    alert(
      "Search temporarily unavailable."
    );

  }

}


/* =====================================================
   ENTER KEY
===================================================== */

document

.getElementById("searchBox")

.addEventListener(

  "keydown",

  function(event){

    if(event.key==="Enter"){

      searchPlace();

    }

  }

);

</script>

</body>

</html>
