<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>URBAN SKY SHIELD</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3yW4R8Y8mY4N7Y5M5Z5Q5Q5Q5Q5Q5="
    crossorigin=""
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ================= HEADER ================= */

    .topbar {
      height: 68px;
      min-height: 68px;
      background: #07111f;
      color: white;
      display: flex;
      align-items: center;
      padding: 10px 18px;
      gap: 15px;
      z-index: 2000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .brand span {
      color: #55d6ff;
    }

    .search-area {
      flex: 1;
      max-width: 650px;
      display: flex;
      gap: 8px;
    }

    #searchBox {
      flex: 1;
      height: 42px;
      border: none;
      outline: none;
      border-radius: 22px;
      padding: 0 18px;
      font-size: 14px;
      background: white;
      color: #111;
    }

    .top-btn {
      height: 42px;
      border: none;
      border-radius: 22px;
      padding: 0 17px;
      cursor: pointer;
      font-weight: 700;
      background: #16b9e9;
      color: white;
    }

    .top-btn:hover {
      background: #0b9bc7;
    }

    .location-btn {
      background: #182a40;
      border: 1px solid #36506d;
    }

    .location-btn:hover {
      background: #24415f;
    }

    /* ================= MAP ================= */

    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
      background: #dbe7ef;
    }

    /* ================= CUSTOM CONTROL ================= */

    .custom-control {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    .custom-control button {
      width: 44px;
      height: 44px;
      border: none;
      background: white;
      cursor: pointer;
      font-size: 21px;
      display: block;
      border-bottom: 1px solid #ddd;
    }

    .custom-control button:last-child {
      border-bottom: none;
    }

    .custom-control button:hover {
      background: #f1f5f9;
    }

    /* ================= LEGEND ================= */

    .legend {
      background: rgba(255,255,255,0.96);
      padding: 12px 14px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      font-size: 12px;
      line-height: 20px;
      color: #17202a;
    }

    .legend-title {
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0,0,0,0.2);
    }

    .red { background: #e53935; }
    .orange { background: #fb8c00; }
    .yellow { background: #fdd835; }
    .green { background: #43a047; }
    .blue { background: #1e88e5; }

    .concept-note {
      margin-top: 7px;
      padding-top: 6px;
      border-top: 1px solid #ddd;
      font-size: 10px;
      color: #555;
    }

    /* ================= LOCATION MARKER ================= */

    .my-location-dot {
      width: 18px;
      height: 18px;
      background: #1683ff;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow:
        0 0 0 5px rgba(22,131,255,0.20),
        0 2px 7px rgba(0,0,0,0.4);
    }

    /* ================= INFO PANEL ================= */

    .info-panel {
      background: rgba(7,17,31,0.94);
      color: white;
      padding: 12px 15px;
      border-radius: 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.35);
      min-width: 190px;
      max-width: 260px;
      font-size: 12px;
    }

    .info-panel strong {
      color: #55d6ff;
      font-size: 14px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

      .topbar {
        height: auto;
        min-height: 112px;
        padding: 9px 10px;
        flex-wrap: wrap;
        gap: 7px;
      }

      .brand {
        font-size: 17px;
        width: 100%;
      }

      .search-area {
        width: 100%;
        max-width: none;
      }

      #searchBox {
        height: 39px;
      }

      .top-btn {
        height: 39px;
        padding: 0 12px;
        font-size: 12px;
      }

      .legend {
        font-size: 10px;
        padding: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <div class="topbar">

    <div class="brand">
      URBAN SKY <span>SHIELD</span>
    </div>

    <div class="search-area">
      <input
        id="searchBox"
        type="text"
        placeholder="Search Chennai, Coimbatore, Madurai..."
      />

      <button class="top-btn" onclick="searchLocation()">
        SEARCH
      </button>

      <button class="top-btn location-btn" onclick="findMyLocation()">
        📍 LOCATION
      </button>
    </div>

  </div>

  <!-- ================= MAP ================= -->

  <div id="map"></div>


  <!-- ================= LEAFLET ================= -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>


  <script>

    /* =========================================================
       1. MAP INITIALIZATION
       ========================================================= */

    const map = L.map("map", {
      zoomControl: false,
      minZoom: 5,
      maxZoom: 19
    }).setView([11.1271, 78.6569], 7);


    /* =========================================================
       2. NORMAL OPENSTREETMAP MAP
       ========================================================= */

    const streetLayer = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
      }
    );

    streetLayer.addTo(map);


    /* =========================================================
       3. SATELLITE MAP
       ========================================================= */

    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "Tiles &copy; Esri"
      }
    );


    /* =========================================================
       4. LIGHT POLLUTION LAYER
       ========================================================= */

    const pollutionLayer = L.layerGroup();

    function addPollutionZone(lat, lon, radius, color, title, description) {

      const circle = L.circle([lat, lon], {
        radius: radius,
        color: color,
        fillColor: color,
        fillOpacity: 0.22,
        weight: 2
      });

      circle.bindPopup(`
        <div style="font-family:Arial;">
          <b>${title}</b><br><br>
          ${description}<br><br>
          <small>
          Planning / conceptual visualization.
          Not a ground-measured Bortle value.
          </small>
        </div>
      `);

      pollutionLayer.addLayer(circle);
    }


    /* =========================================================
       5. VERY HIGH POLLUTION
       ========================================================= */

    addPollutionZone(
      13.0827,
      80.2707,
      30000,
      "#e53935",
      "Chennai Metropolitan Region",
      "Very High lighting-pressure zone"
    );

    addPollutionZone(
      11.0168,
      76.9558,
      22000,
      "#e53935",
      "Coimbatore",
      "Very High lighting-pressure zone"
    );

    addPollutionZone(
      9.9252,
      78.1198,
      20000,
      "#e53935",
      "Madurai",
      "Very High lighting-pressure zone"
    );

    addPollutionZone(
      12.9165,
      79.1325,
      18000,
      "#e53935",
      "Vellore",
      "Very High lighting-pressure zone"
    );


    /* =========================================================
       6. HIGH POLLUTION
       ========================================================= */

    addPollutionZone(
      10.7905,
      78.7047,
      18000,
      "#fb8c00",
      "Tiruchirappalli",
      "High lighting-pressure zone"
    );

    addPollutionZone(
      11.6643,
      78.1460,
      18000,
      "#fb8c00",
      "Salem",
      "High lighting-pressure zone"
    );

    addPollutionZone(
      10.7867,
      79.1378,
      15000,
      "#fb8c00",
      "Thanjavur",
      "High lighting-pressure zone"
    );

    addPollutionZone(
      8.7139,
      77.7567,
      15000,
      "#fb8c00",
      "Tirunelveli",
      "High lighting-pressure zone"
    );

    addPollutionZone(
      11.1085,
      77.3411,
      15000,
      "#fb8c00",
      "Tiruppur",
      "High lighting-pressure zone"
    );


    /* =========================================================
       7. MODERATE POLLUTION
       ========================================================= */

    addPollutionZone(
      11.3410,
      77.7172,
      16000,
      "#fdd835",
      "Erode",
      "Moderate lighting-pressure zone"
    );

    addPollutionZone(
      10.9601,
      78.0766,
      14000,
      "#fdd835",
      "Karur",
      "Moderate lighting-pressure zone"
    );

    addPollutionZone(
      10.3624,
      77.9695,
      14000,
      "#fdd835",
      "Dindigul",
      "Moderate lighting-pressure zone"
    );

    addPollutionZone(
      9.2881,
      79.3129,
      15000,
      "#fdd835",
      "Ramanathapuram",
      "Moderate lighting-pressure zone"
    );

    addPollutionZone(
      8.7642,
      78.1348,
      15000,
      "#fdd835",
      "Thoothukudi",
      "Moderate lighting-pressure zone"
    );


    /* =========================================================
       8. LOW POLLUTION
       ========================================================= */

    addPollutionZone(
      11.4102,
      76.6950,
      26000,
      "#43a047",
      "Nilgiris / Ooty",
      "Low lighting-pressure / dark-sky potential"
    );

    addPollutionZone(
      12.2253,
      79.0747,
      17000,
      "#43a047",
      "Tiruvannamalai",
      "Low lighting-pressure zone"
    );

    addPollutionZone(
      8.0883,
      77.5385,
      18000,
      "#43a047",
      "Kanyakumari Interior",
      "Low lighting-pressure zone"
    );


    /* =========================================================
       9. VERY LOW / DARK SKY POTENTIAL
       ========================================================= */

    addPollutionZone(
      11.45,
      76.40,
      35000,
      "#1e88e5",
      "Nilgiri Interior",
      "Very Low / Dark-sky potential"
    );

    addPollutionZone(
      10.00,
      78.00,
      30000,
      "#1e88e5",
      "Southern Interior",
      "Very Low / Dark-sky potential"
    );

    addPollutionZone(
      10.75,
      79.35,
      30000,
      "#1e88e5",
      "Delta Rural Region",
      "Very Low / Dark-sky potential"
    );


    /* =========================================================
       10. ADD POLLUTION LAYER BY DEFAULT
       ========================================================= */

    pollutionLayer.addTo(map);


    /* =========================================================
       11. CONCEPTUAL TRAFFIC LAYER
       ========================================================= */

    const trafficLayer = L.layerGroup();

    function trafficRoad(points, color, name) {

      const line = L.polyline(points, {
        color: color,
        weight: 5,
        opacity: 0.75
      });

      line.bindPopup(`
        <b>Traffic Visualization</b><br>
        ${name}<br><br>
        <small>
        Planning visualization only.
        Not live traffic data.
        </small>
      `);

      trafficLayer.addLayer(line);
    }


    /* Chennai corridors */

    trafficRoad(
      [
        [13.0827,80.2707],
        [13.0475,80.2090],
        [12.9850,80.2180]
      ],
      "#e53935",
      "Chennai urban corridor"
    );

    trafficRoad(
      [
        [13.0827,80.2707],
        [13.1200,80.1900],
        [13.1700,80.1300]
      ],
      "#fb8c00",
      "Chennai western corridor"
    );

    trafficRoad(
      [
        [13.0827,80.2707],
        [12.9500,80.2500],
        [12.8500,80.2300]
      ],
      "#fdd835",
      "Chennai southern corridor"
    );


    /* Chennai - Vellore */

    trafficRoad(
      [
        [13.0827,80.2707],
        [12.9165,79.1325]
      ],
      "#e53935",
      "Chennai - Vellore corridor"
    );


    /* Chennai - Trichy */

    trafficRoad(
      [
        [13.0827,80.2707],
        [12.5000,79.9000],
        [11.9000,79.7000],
        [10.7905,78.7047]
      ],
      "#fb8c00",
      "Chennai - Trichy corridor"
    );


    /* Coimbatore - Salem */

    trafficRoad(
      [
        [11.0168,76.9558],
        [11.2500,77.0000],
        [11.6643,78.1460]
      ],
      "#fb8c00",
      "Coimbatore - Salem corridor"
    );


    /* Madurai - Trichy */

    trafficRoad(
      [
        [9.9252,78.1198],
        [10.3500,78.5000],
        [10.7905,78.7047]
      ],
      "#fdd835",
      "Madurai - Trichy corridor"
    );


    /* =========================================================
       12. MAP CONTROLS
       ========================================================= */

    L.control.zoom({
      position: "topright"
    }).addTo(map);


    /* =========================================================
       13. LAYER CONTROL
       ========================================================= */

    const baseMaps = {
      "Normal Map": streetLayer,
      "Satellite": satelliteLayer
    };

    const overlays = {
      "💡 Light Pollution": pollutionLayer,
      "🚦 Traffic Visualization": trafficLayer
    };

    L.control.layers(
      baseMaps,
      overlays,
      {
        collapsed: false,
        position: "topright"
      }
    ).addTo(map);


    /* =========================================================
       14. LOCATION CONTROL
       ========================================================= */

    let locationMarker = null;
    let accuracyCircle = null;

    function findMyLocation() {

      if (!navigator.geolocation) {
        alert("GPS / Location is not supported by this browser.");
        return;
      }

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          map.setView([lat, lon], 17);

          if (locationMarker) {
            map.removeLayer(locationMarker);
          }

          if (accuracyCircle) {
            map.removeLayer(accuracyCircle);
          }

          const icon = L.divIcon({
            className: "",
            html: '<div class="my-location-dot"></div>',
            iconSize: [18,18],
            iconAnchor: [9,9]
          });

          locationMarker = L.marker(
            [lat, lon],
            { icon: icon }
          ).addTo(map);

          accuracyCircle = L.circle(
            [lat, lon],
            {
              radius: accuracy,
              color: "#1683ff",
              fillColor: "#1683ff",
              fillOpacity: 0.12,
              weight: 1
            }
          ).addTo(map);

          locationMarker.bindPopup(
            "<b>Your Current Location</b><br>" +
            "Accuracy: approximately " +
            Math.round(accuracy) +
            " metres"
          ).openPopup();

          reverseGeocode(lat, lon);
        },

        function(error) {

          if (error.code === 1) {
            alert(
              "Location permission denied.\n\n" +
              "Please allow Location permission for your browser and try again."
            );
          }

          else if (error.code === 2) {
            alert("Your location could not be determined.");
          }

          else if (error.code === 3) {
            alert("Location request timed out. Try again.");
          }

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }


    /* =========================================================
       15. REVERSE GEOCODING
       ========================================================= */

    async function reverseGeocode(lat, lon) {

      try {

        const url =
          "https://nominatim.openstreetmap.org/reverse" +
          "?format=json" +
          "&lat=" + encodeURIComponent(lat) +
          "&lon=" + encodeURIComponent(lon) +
          "&zoom=18" +
          "&addressdetails=1";

        const response = await fetch(url, {
          headers: {
            "Accept": "application/json"
          }
        });

        const data = await response.json();

        if (!data || !data.display_name) {
          return;
        }

        const address = data.address || {};

        const road =
          address.road ||
          address.pedestrian ||
          address.neighbourhood ||
          "Location";

        const city =
          address.city ||
          address.town ||
          address.village ||
          address.suburb ||
          "";

        const state =
          address.state || "Tamil Nadu";

        if (locationMarker) {

          locationMarker.bindPopup(`
            <div class="info-panel">
              <strong>📍 Current Location</strong>
              <br><br>
              <b>${road}</b>
              <br>
              ${city}
              <br>
              ${state}
              <br><br>
              <small>
              GPS location detected from your device.
              </small>
            </div>
          `);

        }

      } catch (error) {

        console.log("Reverse geocoding unavailable:", error);

      }
    }


    /* =========================================================
       16. SEARCH LOCATION
       ========================================================= */

    async function searchLocation() {

      const query =
        document.getElementById("searchBox").value.trim();

      if (!query) {
        alert("Type a place name first.");
        return;
      }

      try {

        const url =
          "https://nominatim.openstreetmap.org/search" +
          "?format=json" +
          "&q=" + encodeURIComponent(query) +
          "&limit=1" +
          "&countrycodes=in";

        const response = await fetch(url, {
          headers: {
            "Accept": "application/json"
          }
        });

        const results = await response.json();

        if (!results.length) {
          alert("Location not found.");
          return;
        }

        const result = results[0];

        const lat = parseFloat(result.lat);
        const lon = parseFloat(result.lon);

        map.setView(
          [lat, lon],
          15,
          {
            animate: true
          }
        );

        L.marker([lat, lon])
          .addTo(map)
          .bindPopup(
            "<b>" +
            result.display_name +
            "</b>"
          )
          .openPopup();

      } catch (error) {

        alert(
          "Search service is temporarily unavailable."
        );

        console.error(error);
      }
    }


    /* =========================================================
       17. ENTER KEY SEARCH
