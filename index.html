<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>URBAN SKY SHIELD</title>

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  flex-direction:column;
  background:#071522;
}

/* ================= HEADER ================= */

.header{
  height:70px;
  min-height:70px;
  background:#071522;
  color:white;
  display:flex;
  align-items:center;
  gap:15px;
  padding:10px 16px;
  z-index:9999;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:1px;
  white-space:nowrap;
}

.logo span{
  color:#43d9ff;
}

.search{
  flex:1;
  display:flex;
  gap:7px;
  max-width:700px;
}

.search input{
  flex:1;
  height:40px;
  border:0;
  outline:0;
  border-radius:20px;
  padding:0 16px;
  font-size:14px;
}

.btn{
  height:40px;
  border:0;
  border-radius:20px;
  padding:0 15px;
  cursor:pointer;
  font-weight:bold;
  color:white;
  background:#08a9d8;
}

.btn:hover{
  background:#078db5;
}

.locationBtn{
  background:#17304a;
  border:1px solid #36536d;
}

/* ================= MAP ================= */

#map{
  flex:1;
  width:100%;
  min-height:0;
  background:#dce7ee;
}

/* ================= LOCATION DOT ================= */

.location-dot{
  width:18px;
  height:18px;
  border-radius:50%;
  background:#1683ff;
  border:3px solid white;
  box-shadow:
    0 0 0 5px rgba(22,131,255,.20),
    0 2px 8px rgba(0,0,0,.45);
}

/* ================= POPUP ================= */

.popup-title{
  font-size:15px;
  font-weight:bold;
  margin-bottom:5px;
}

/* ================= LEGEND ================= */

.legend{
  background:rgba(255,255,255,.96);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:0 2px 12px rgba(0,0,0,.3);
  color:#17202a;
  font-size:12px;
  line-height:20px;
}

.legend-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:5px;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:7px;
}

.legend-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  border:1px solid rgba(0,0,0,.25);
}

.note{
  border-top:1px solid #ddd;
  margin-top:6px;
  padding-top:5px;
  font-size:10px;
  color:#555;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .header{
    height:105px;
    min-height:105px;
    flex-wrap:wrap;
    padding:8px;
    gap:6px;
  }

  .logo{
    width:100%;
    font-size:17px;
  }

  .search{
    width:100%;
    max-width:none;
  }

  .search input{
    height:37px;
    min-width:0;
  }

  .btn{
    height:37px;
    padding:0 10px;
    font-size:11px;
  }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

  <div class="logo">
    URBAN SKY <span>SHIELD</span>
  </div>

  <div class="search">

    <input
      id="searchBox"
      type="text"
      placeholder="Search Chennai, Madurai, Ooty..."
    >

    <button class="btn" onclick="searchPlace()">
      SEARCH
    </button>

    <button
      class="btn locationBtn"
      onclick="getMyLocation()"
    >
      📍 LOCATION
    </button>

  </div>

</div>


<!-- ================= MAP ================= -->

<div id="map"></div>


<!-- ================= LEAFLET JS ================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {
  zoomControl:false,
  minZoom:5,
  maxZoom:19
}).setView(
  [11.1271,78.6569],
  7
);


/* =========================================================
   NORMAL MAP
========================================================= */

const normalMap = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:
      '&copy; OpenStreetMap contributors'
  }
);

normalMap.addTo(map);


/* =========================================================
   SATELLITE
========================================================= */

const satelliteMap = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    attribution:
      "Tiles &copy; Esri"
  }
);


/* =========================================================
   POLLUTION LAYER
========================================================= */

const pollutionLayer = L.layerGroup();


function pollution(
  lat,
  lon,
  radius,
  color,
  name,
  level
){

  const circle = L.circle(
    [lat,lon],
    {
      radius:radius,
      color:color,
      fillColor:color,
      fillOpacity:.22,
      weight:2
    }
  );

  circle.bindPopup(`
    <div class="popup-title">
      ${name}
    </div>

    <b>Lighting level:</b>
    ${level}

    <br><br>

    <small>
      Conceptual planning visualization.
      Not a ground-measured Bortle value.
    </small>
  `);

  pollutionLayer.addLayer(circle);
}


/* =========================================================
   VERY HIGH
========================================================= */

pollution(
  13.0827,
  80.2707,
  30000,
  "#e53935",
  "Chennai Metropolitan Region",
  "Very High"
);

pollution(
  11.0168,
  76.9558,
  22000,
  "#e53935",
  "Coimbatore",
  "Very High"
);

pollution(
  9.9252,
  78.1198,
  20000,
  "#e53935",
  "Madurai",
  "Very High"
);

pollution(
  12.9165,
  79.1325,
  18000,
  "#e53935",
  "Vellore",
  "Very High"
);


/* =========================================================
   HIGH
========================================================= */

pollution(
  10.7905,
  78.7047,
  18000,
  "#fb8c00",
  "Tiruchirappalli",
  "High"
);

pollution(
  11.6643,
  78.1460,
  18000,
  "#fb8c00",
  "Salem",
  "High"
);

pollution(
  10.7867,
  79.1378,
  15000,
  "#fb8c00",
  "Thanjavur",
  "High"
);

pollution(
  8.7139,
  77.7567,
  15000,
  "#fb8c00",
  "Tirunelveli",
  "High"
);

pollution(
  11.1085,
  77.3411,
  15000,
  "#fb8c00",
  "Tiruppur",
  "High"
);


/* =========================================================
   MODERATE
========================================================= */

pollution(
  11.3410,
  77.7172,
  16000,
  "#fdd835",
  "Erode",
  "Moderate"
);

pollution(
  10.9601,
  78.0766,
  14000,
  "#fdd835",
  "Karur",
  "Moderate"
);

pollution(
  10.3624,
  77.9695,
  14000,
  "#fdd835",
  "Dindigul",
  "Moderate"
);

pollution(
  9.2881,
  79.3129,
  15000,
  "#fdd835",
  "Ramanathapuram",
  "Moderate"
);

pollution(
  8.7642,
  78.1348,
  15000,
  "#fdd835",
  "Thoothukudi",
  "Moderate"
);


/* =========================================================
   LOW
========================================================= */

pollution(
  11.4102,
  76.6950,
  26000,
  "#43a047",
  "Nilgiris / Ooty",
  "Low"
);

pollution(
  12.2253,
  79.0747,
  17000,
  "#43a047",
  "Tiruvannamalai",
  "Low"
);

pollution(
  8.0883,
  77.5385,
  18000,
  "#43a047",
  "Kanyakumari Interior",
  "Low"
);


/* =========================================================
   VERY LOW
========================================================= */

pollution(
  11.45,
  76.40,
  35000,
  "#1e88e5",
  "Nilgiri Interior",
  "Very Low / Dark-sky potential"
);

pollution(
  10.00,
  78.00,
  30000,
  "#1e88e5",
  "Southern Interior",
  "Very Low / Dark-sky potential"
);

pollution(
  10.75,
  79.35,
  30000,
  "#1e88e5",
  "Delta Rural Region",
  "Very Low / Dark-sky potential"
);

pollutionLayer.addTo(map);


/* =========================================================
   TRAFFIC VISUALIZATION
========================================================= */

const trafficLayer = L.layerGroup();


function traffic(points,color,name){

  const line = L.polyline(
    points,
    {
      color:color,
      weight:6,
      opacity:.75
    }
  );

  line.bindPopup(`
    <b>Traffic Visualization</b>
    <br>
    ${name}
    <br><br>
    <small>
      Demonstration layer only.
      Not live traffic data.
    </small>
  `);

  trafficLayer.addLayer(line);
}


/* Chennai */

traffic(
  [
    [13.0827,80.2707],
    [13.0475,80.2090],
    [12.9850,80.2180]
  ],
  "#e53935",
  "Chennai urban corridor"
);

traffic(
  [
    [13.0827,80.2707],
    [13.1200,80.1900],
    [13.1700,80.1300]
  ],
  "#fb8c00",
  "Chennai western corridor"
);

traffic(
  [
    [13.0827,80.2707],
    [12.9500,80.2500],
    [12.8500,80.2300]
  ],
  "#fdd835",
  "Chennai southern corridor"
);


/* Chennai - Vellore */

traffic(
  [
    [13.0827,80.2707],
    [12.9165,79.1325]
  ],
  "#e53935",
  "Chennai - Vellore corridor"
);


/* Chennai - Trichy */

traffic(
  [
    [13.0827,80.2707],
    [12.5000,79.9000],
    [11.9000,79.7000],
    [10.7905,78.7047]
  ],
  "#fb8c00",
  "Chennai - Trichy corridor"
);


/* Coimbatore - Salem */

traffic(
  [
    [11.0168,76.9558],
    [11.2500,77.0000],
    [11.6643,78.1460]
  ],
  "#fb8c00",
  "Coimbatore - Salem corridor"
);


/* Madurai - Trichy */

traffic(
  [
    [9.9252,78.1198],
    [10.3500,78.5000],
    [10.7905,78.7047]
  ],
  "#fdd835",
  "Madurai - Trichy corridor"
);


/* =========================================================
   ZOOM CONTROL
========================================================= */

L.control.zoom({
  position:"topright"
}).addTo(map);


/* =========================================================
   LAYERS
========================================================= */

L.control.layers(
  {
    "🗺️ Normal Map":normalMap,
    "🛰️ Satellite":satelliteMap
  },
  {
    "💡 Light Pollution":pollutionLayer,
    "🚦 Traffic":trafficLayer
  },
  {
    collapsed:false,
    position:"topright"
  }
).addTo(map);


/* =========================================================
   LEGEND
========================================================= */

const legend =
L.control({
  position:"bottomright"
});


legend.onAdd=function(){

  const div=L.DomUtil.create(
    "div",
    "legend"
  );

  div.innerHTML=`

    <div class="legend-title">
      💡 Light Pollution
    </div>

    <div class="legend-row">
      <span class="legend-dot"
      style="background:#e53935"></span>
      Very High
    </div>

    <div class="legend-row">
      <span class="legend-dot"
      style="background:#fb8c00"></span>
      High
    </div>

    <div class="legend-row">
      <span class="legend-dot"
      style="background:#fdd835"></span>
      Moderate
    </div>

    <div class="legend-row">
      <span class="legend-dot"
      style="background:#43a047"></span>
      Low
    </div>

    <div class="legend-row">
      <span class="legend-dot"
      style="background:#1e88e5"></span>
      Very Low / Dark-sky
    </div>

    <div class="note">
      Conceptual planning visualization
    </div>

  `;

  return div;
};

legend.addTo(map);


/* =========================================================
   CURRENT LOCATION
========================================================= */

let currentMarker=null;
let accuracyCircle=null;


function getMyLocation(){

  if(!navigator.geolocation){

    alert(
      "Location is not supported by this browser."
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      map.setView(
        [lat,lon],
        17,
        {
          animate:true
        }
      );


      if(currentMarker){
        map.removeLayer(currentMarker);
      }


      if(accuracyCircle){
        map.removeLayer(accuracyCircle);
      }


      const icon =
        L.divIcon({
          className:"",
          html:
            '<div class="location-dot"></div>',
          iconSize:[18,18],
          iconAnchor:[9,9]
        });


      currentMarker =
        L.marker(
          [lat,lon],
          {
            icon:icon
          }
        )
        .addTo(map);


      accuracyCircle =
        L.circle(
          [lat,lon],
          {
            radius:accuracy,
            color:"#1683ff",
            fillColor:"#1683ff",
            fillOpacity:.12,
            weight:1
          }
        )
        .addTo(map);


      currentMarker.bindPopup(`
        <b>📍 Your Current Location</b>
        <br><br>
        GPS accuracy:
        approximately ${Math.round(accuracy)} m
      `).openPopup();


      reverseLocation(
        lat,
        lon
      );

    },

    function(error){

      if(error.code===1){

        alert(
          "Location permission denied.\n\n" +
          "Please allow Location permission in Chrome."
        );

      }

      else if(error.code===2){

        alert(
          "Location could not be determined."
        );

      }

      else if(error.code===3){

        alert(
          "Location request timed out. Try again."
        );

      }

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


/* =========================================================
   REVERSE LOCATION
========================================================= */

async function reverseLocation(
  lat,
  lon
){

  try{

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/reverse" +
        "?format=json" +
        "&lat="+lat+
        "&lon="+lon+
        "&zoom=18"+
        "&addressdetails=1"
      );


    const data =
      await response.json();


    if(
      currentMarker &&
      data.display_name
    ){

      const address =
        data.address || {};


      const road =
        address.road ||
        address.neighbourhood ||
        "Location";


      const city =
        address.city ||
        address.town ||
        address.village ||
        address.suburb ||
        "";


      currentMarker.bindPopup(`
        <b>📍 Current Location</b>
        <br><br>
        <b>${road}</b>
        <br>
        ${city}
        <br>
        Tamil Nadu
      `);

    }

  }catch(error){

    console.log(
      "Reverse geocoding unavailable"
    );

  }

}


/* =========================================================
   SEARCH
========================================================= */

async function searchPlace(){

  const query =
    document
      .getElementById("searchBox")
      .value
      .trim();


  if(!query){

    alert(
      "Type a place name first."
    );

    return;
  }


  try{

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/search" +
        "?format=json" +
        "&q="+
        encodeURIComponent(query)+
        "&limit=1" +
        "&countrycodes=in"
      );


    const results =
      await response.json();


    if(!results.length){

      alert(
        "Location not found."
      );

      return;
    }


    const place =
      results[0];


    const lat =
      parseFloat(place.lat);

    const lon =
      parseFloat(place.lon);


    map.setView(
      [lat,lon],
      15,
      {
        animate:true
      }
    );


    L.marker(
      [lat,lon]
    )
    .addTo(map)
    .bindPopup(
      "<b>"+
      place.display_name+
      "</b>"
    )
    .openPopup();


  }catch(error){

    alert(
      "Search service unavailable."
    );

  }

}


/* =========================================================
   ENTER KEY
========================================================= */

document
  .getElementById("searchBox")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key==="Enter"){
        searchPlace();
      }

    }
  );


/* =========================================================
   FIX MAP SIZE
========================================================= */

setTimeout(
  function(){

    map.invalidateSize();

  },
  500
);


window.addEventListener(
  "resize",
  function(){

    map.invalidateSize();

  }
);


/* =========================================================
   DONE
========================================================= */

console.log(
  "URBAN SKY SHIELD MAP LOADED"
);

</script>

</body>
  </html>
