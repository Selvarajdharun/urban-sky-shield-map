<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Urban Sky Shield</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#071522;
}

/* ================= HEADER ================= */

#header{
  height:72px;
  background:#08283d;
  color:white;
  padding:7px 8px;
  border-bottom:1px solid #31576d;
}

#title{
  color:#50dcff;
  font-size:15px;
  font-weight:800;
  letter-spacing:.6px;
}

#subtitle{
  color:#b8d6e5;
  font-size:8px;
  margin-top:1px;
  margin-bottom:7px;
}

.topControls{
  display:flex;
  gap:5px;
  width:100%;
}

#searchBox{
  flex:1;
  min-width:0;
  height:28px;
  border:1px solid #3a6074;
  border-radius:5px;
  background:#061723;
  color:white;
  padding:0 9px;
  font-size:11px;
  outline:none;
}

#searchBox::placeholder{
  color:#91aab8;
}

.topButton{
  height:28px;
  border:1px solid #3a6074;
  border-radius:5px;
  background:#183e56;
  color:white;
  font-size:9px;
  font-weight:bold;
  padding:0 8px;
}

/* ================= MAP ================= */

#map{
  width:100%;
  height:calc(100vh - 72px);
}

/* ================= RIGHT BUTTONS ================= */

.mapButtons{
  position:absolute;
  right:9px;
  top:82px;
  z-index:1000;

  display:flex;
  flex-direction:column;
  gap:7px;
}

.mapButton{
  width:38px;
  height:38px;

  border:none;
  border-radius:10px;

  background:#092638;
  color:white;

  font-size:18px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.4);

  display:flex;
  align-items:center;
  justify-content:center;
}

.mapButton:active{
  transform:scale(.93);
}

/* ================= LOCATION DOT ================= */

.locationDot{
  width:19px;
  height:19px;

  background:#168cff;

  border:3px solid white;

  border-radius:50%;

  box-shadow:
    0 0 0 4px rgba(22,140,255,.25),
    0 2px 8px rgba(0,0,0,.45);
}

/* ================= LOCATION INFO ================= */

.locationInfo{
  background:white;
  color:#222;

  padding:8px 10px;

  border-radius:7px;

  font-size:10px;
  line-height:15px;

  max-width:235px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.3);
}

.locationInfo strong{
  color:#075eae;
}

/* ================= LEGEND ================= */

.legend{
  background:rgba(255,255,255,.95);

  padding:8px 10px;

  border-radius:6px;

  font-size:10px;

  line-height:17px;

  color:#222;

  box-shadow:
    0 2px 7px rgba(0,0,0,.3);
}

.legendTitle{
  font-weight:bold;
  margin-bottom:3px;
}

.legendRow{
  display:flex;
  align-items:center;
  gap:5px;
}

.legendDot{
  width:10px;
  height:10px;
  border-radius:50%;
}

/* ================= TRAFFIC LEGEND ================= */

.trafficLegend{
  background:rgba(255,255,255,.95);

  padding:8px 10px;

  border-radius:6px;

  font-size:10px;

  color:#222;

  box-shadow:
    0 2px 7px rgba(0,0,0,.3);
}

.trafficLine{
  width:25px;
  height:4px;
  border-radius:4px;
}

/* ================= SEARCH MESSAGE ================= */

#message{
  position:absolute;

  top:105px;
  left:50%;

  transform:translateX(-50%);

  z-index:2000;

  background:rgba(0,0,0,.85);
  color:white;

  padding:8px 13px;

  border-radius:6px;

  font-size:11px;

  display:none;
}

/* ================= LEAFLET ================= */

.leaflet-control-attribution{
  font-size:7px !important;
}

.leaflet-control-zoom{
  margin-top:8px !important;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  #header{
    height:72px;
  }

  #map{
    height:calc(100vh - 72px);
  }

  .mapButtons{
    top:81px;
    right:8px;
  }

  .mapButton{
    width:36px;
    height:36px;
  }
}

</style>
</head>

*/

===================================================== */

).addTo(map);

===================================================== */

L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

/* =====================================================
   LAYERS CONTROL
===================================================== */

function toggleLayers(){

  const choice =
    prompt(
      "MAP LAYERS\n\n" +
      "1 = Normal Map\n" +
      "2 = Satellite Map\n" +
      "3 = Light Pollution\n" +
      "4 = Traffic Demo\n\n" +
      "Enter number:"
    );

  if(choice==="1"){

    if(satelliteVisible){

      map.removeLayer(satelliteMap);

      normalMap.addTo(map);

      satelliteVisible=false;
    }

  }

  if(choice==="2"){

    if(!satelliteVisible){

      map.removeLayer(normalMap);

      satelliteMap.addTo(map);

      satelliteVisible=true;
    }

  }

  if(choice==="3"){

    togglePollution();

  }

  if(choice==="4"){

    toggleTraffic();

  }

}

/* =====================================================
   GPS SUCCESS
===================================================== */

function gpsSuccess(position){

  const lat=
    position.coords.latitude;

  const lon=
    position.coords.longitude;

  const accuracy=
    position.coords.accuracy;


  /*
    Ignore worse readings
  */

  if(
    userMarker &&
    accuracy>bestAccuracy
  ){
    return;
  }


  bestAccuracy=accuracy;


  /* LOCATION MARKER */

  if(!userMarker){

    userMarker=
      L.marker(
        [lat,lon],
        {
          icon:locationIcon,
          zIndexOffset:3000
        }
      ).addTo(map);

  }else{

    userMarker.setLatLng(
      [lat,lon]
    );

  }


  /* ACCURACY CIRCLE */

  if(!accuracyCircle){

    accuracyCircle=
      L.circle(
        [lat,lon],
        {
          radius:accuracy,

          color:"#168cff",

          fillColor:"#168cff",

          fillOpacity:.10,

          weight:1
        }
      ).addTo(map);

  }else{

    accuracyCircle.setLatLng(
      [lat,lon]
    );

    accuracyCircle.setRadius(
      accuracy
    );

  }


  /*
    AUTOMATICALLY MOVE TO
    REAL PHONE LOCATION
  */

  if(firstGPSFix){

    firstGPSFix=false;


    let zoom=16;


    if(accuracy>1000){

      zoom=10;

    }else if(accuracy>500){

      zoom=12;

    }else if(accuracy>200){

      zoom=14;

    }else if(accuracy>80){

      zoom=15;

    }else{

      zoom=17;

    }


    map.setView(
      [lat,lon],
      zoom,
      {
        animate:true
      }
    );

  }


  showLocationInfo(`

    <strong>📍 Your Location</strong>

    <br>

    GPS accuracy:
    ±${Math.round(accuracy)} m

    <br>

    <span style="font-size:8px">
      Waiting for better GPS accuracy...
    </span>

  `);


  /*
    Reverse geocoding
  */

  if(accuracy<=150){

    reverseGeocode(
      lat,
      lon,
      accuracy
    );

  }


}


/* =====================================================
   GPS ERROR
===================================================== */

function gpsError(error){

  let message="";


  if(error.code===1){

    message=`

      <strong>Location permission denied</strong>

      <br>

      Allow location permission
      for Chrome.

    `;

  }

  else if(error.code===2){

    message=`

      <strong>GPS unavailable</strong>

      <br>

      Turn ON phone Location/GPS.

    `;

  }

  else if(error.code===3){

    message=`

      <strong>GPS timeout</strong>

      <br>

      Wait a few seconds and try again.

    `;

  }

  else{

    message=`

      <strong>Unable to get location.</strong>

    `;

  }


  showLocationInfo(message);

}


/* =====================================================
   START GPS
===================================================== */

function locateUser(){

  if(!navigator.geolocation){

    alert(
      "GPS is not supported by this browser."
    );

    return;
  }


  /*
    Reset
  */

  bestAccuracy=Infinity;

  firstGPSFix=true;


  /*
    Clear previous watch
  */

  if(locationWatchId!==null){

    navigator.geolocation.clearWatch(
      locationWatchId
    );

  }


  showLocationInfo(`

    <strong>?
