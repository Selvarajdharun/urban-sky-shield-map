<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Urban Sky Shield</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
}


/* ==============================
   TOP AREA
============================== */

.top-panel {

  position: absolute;

  z-index: 1000;

  top: 10px;

  left: 10px;

  right: 10px;

  max-width: 720px;

  margin: auto;
}


/* ==============================
   TITLE
============================== */

.title-box {

  background: rgba(255,255,255,0.97);

  padding: 12px 16px;

  border-radius: 17px;

  box-shadow:
  0 3px 15px rgba(0,0,0,0.25);

  margin-bottom: 8px;
}

.title {

  font-size: 22px;

  font-weight: bold;

  color: #123b4a;

  letter-spacing: 0.7px;
}


/* ==============================
   SEARCH
============================== */

.search-row {

  display: flex;

  gap: 7px;
}

.search-row input {

  flex: 1;

  min-width: 0;

  height: 46px;

  border: none;

  border-radius: 14px;

  padding: 0 15px;

  font-size: 15px;

  outline: none;

  box-shadow:
  0 3px 13px rgba(0,0,0,0.25);
}

.search-btn,
.location-btn {

  height: 46px;

  border: none;

  border-radius: 14px;

  padding: 0 17px;

  font-weight: bold;

  font-size: 14px;

  box-shadow:
  0 3px 13px rgba(0,0,0,0.25);

  cursor: pointer;
}

.search-btn {

  background: #087f9b;

  color: white;
}

.location-btn {

  background: white;

  color: #075c73;
}


/* ==============================
   LOCATION BUTTON
============================== */

.locate-control {

  position: absolute;

  z-index: 1000;

  right: 15px;

  bottom: 30px;
}

.locate-big {

  width: 58px;

  height: 58px;

  border: none;

  border-radius: 18px;

  background: white;

  color: #1769ff;

  font-size: 28px;

  box-shadow:
  0 4px 15px rgba(0,0,0,0.30);

  cursor: pointer;
}


/* ==============================
   USER LOCATION DOT
============================== */

.user-dot {

  width: 20px;

  height: 20px;

  background: #1769ff;

  border: 4px solid white;

  border-radius: 50%;

  box-shadow:

  0 0 0 5px
  rgba(23,105,255,0.20),

  0 3px 10px
  rgba(0,0,0,0.35);
}


/* ==============================
   LEAFLET ZOOM BUTTON
============================== */

.leaflet-control-zoom {

  margin-top: 135px !important;

  margin-left: 10px !important;

}

.leaflet-control-zoom a {

  width: 42px !important;

  height: 42px !important;

  line-height: 42px !important;

  font-size: 25px !important;

  background: white !important;

  color: #123b4a !important;

}


/* ==============================
   MOBILE
============================== */

@media (max-width: 600px) {

  .top-panel {

    top: 7px;

    left: 7px;

    right: 7px;
  }

  .title-box {

    padding: 10px 13px;
  }

  .title {

    font-size: 19px;
  }

  .search-row {

    flex-wrap: wrap;
  }

  .search-row input {

    width: 100%;

    flex: none;
  }

  .search-btn,
  .location-btn {

    flex: 1;
  }

}

</style>

</head>


<body>


<!-- MAP -->

<div id="map"></div>


<!-- ==============================
     TOP PANEL
============================== -->

<div class="top-panel">

  <div class="title-box">

    <div class="title">
      🌌 URBAN SKY SHIELD
    </div>

  </div>


  <div class="search-row">

    <input
      id="searchBox"
      type="text"
      placeholder="Search Chennai, Madurai, Ooty..."
    >


    <button
      class="search-btn"
      onclick="searchPlace()"
    >
      SEARCH
    </button>


    <button
      class="location-btn"
      onclick="findMyLocation()"
    >
      📍 LOCATION
    </button>

  </div>

</div>


<!-- ==============================
     LOCATION BUTTON
============================== -->

<div class="locate-control">

  <button
    class="locate-big"
    onclick="findMyLocation()"
    title="My Location"
  >
    ⦿
  </button>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =================================
   CREATE MAP
================================= */

const map = L.map("map", {

  zoomControl: true,

  minZoom: 5,

  maxZoom: 19

}).setView(

  [11.1271, 78.6569],

  7

);


/* =================================
   NORMAL CLEAR STREET MAP
================================= */

const streetMap = L.tileLayer(

  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",

  {

    maxZoom: 19,

    attribution:
      "© Esri, OpenStreetMap contributors"

  }

);


/* ADD MAP */

streetMap.addTo(map);


/* =================================
   LIGHT POLLUTION ZONES
================================= */

const cities = [

  {
    name: "Chennai",
    lat: 13.0827,
    lon: 80.2707,
    color: "#ff3030",
    radius: 22000,
    level: "Very High"
  },

  {
    name: "Coimbatore",
    lat: 11.0168,
    lon: 76.9558,
    color: "#ff8c00",
    radius: 15000,
    level: "High"
  },

  {
    name: "Madurai",
    lat: 9.9252,
    lon: 78.1198,
    color: "#ff8c00",
    radius: 14000,
    level: "High"
  },

  {
    name: "Tiruchirappalli",
    lat: 10.7905,
    lon: 78.7047,
    color: "#ffc107",
    radius: 12000,
    level: "Moderate"
  },

  {
    name: "Salem",
    lat: 11.6643,
    lon: 78.1460,
    color: "#ffc107",
    radius: 12000,
    level: "Moderate"
  },

  {
    name: "Vellore",
    lat: 12.9165,
    lon: 79.1325,
    color: "#ffc107",
    radius: 10000,
    level: "Moderate"
  },

  {
    name: "Tirunelveli",
    lat: 8.7139,
    lon: 77.7567,
    color: "#2ecc71",
    radius: 9000,
    level: "Lower"
  },

  {
    name: "Ooty",
    lat: 11.4102,
    lon: 76.6950,
    color: "#2ecc71",
    radius: 7000,
    level: "Lower"
  },

  {
    name: "Thanjavur",
    lat: 10.7870,
    lon: 79.1378,
    color: "#ffc107",
    radius: 8000,
    level: "Moderate"
  }

];


/* =================================
   DRAW POLLUTION ZONES
================================= */

cities.forEach(function(city) {

  L.circle(

    [city.lat, city.lon],

    {

      radius: city.radius,

      color: city.color,

      fillColor: city.color,

      fillOpacity: 0.15,

      weight: 2

    }

  )

  .addTo(map)

  .bindPopup(

    "<b>" +
    city.name +
    "</b><br>" +

    "Planning zone: " +
    city.level +

    "<br><br>" +

    "<small>" +

    "Visualization only — " +

    "not direct ground measurement." +

    "</small>"

  );

});


/* =================================
   USER LOCATION VARIABLES
================================= */

let userMarker = null;

let accuracyCircle = null;


/* =================================
   FIND MY LOCATION
================================= */

function findMyLocation() {

  if (!navigator.geolocation) {

    alert(
      "Location is not supported by this browser."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      /* REMOVE OLD MARKER */

      if (userMarker) {

        map.removeLayer(userMarker);

      }


      /* REMOVE OLD ACCURACY */

      if (accuracyCircle) {

        map.removeLayer(accuracyCircle);

      }


      /* ==========================
         BLUE LOCATION MARKER
      ========================== */

      userMarker = L.marker(

        [lat, lon],

        {

          icon: L.divIcon({

            className: "",

            html:
              '<div class="user-dot"></div>',

            iconSize: [20,20],

            iconAnchor: [10,10]

          })

        }

      )

      .addTo(map);


      /* ==========================
         ACCURACY CIRCLE
      ========================== */

      accuracyCircle = L.circle(

        [lat, lon],

        {

          radius: accuracy,

          color: "#1769ff",

          fillColor: "#1769ff",

          fillOpacity: 0.08,

          weight: 2

        }

      )

      .addTo(map);


      /* ==========================
         MOVE TO CURRENT LOCATION
      ========================== */

      map.flyTo(

        [lat, lon],

        18,

        {

          duration: 1.5

        }

      );


      /* ==========================
         POPUP
      ========================== */

      userMarker

        .bindPopup(

          "<b>📍 You are here</b><br>" +

          "Accuracy: approximately " +

          Math.round(accuracy) +

          " metres"

        )

        .openPopup();

    },


    function(error) {

      if (error.code === 1) {

        alert(

          "Location permission denied.\n\n" +

          "Please allow Location permission " +

          "for this website in your browser settings."

        );

      }

      else if (error.code === 2) {

        alert(

          "Location unavailable.\n\n" +

          "Please turn ON your phone GPS/Location."

        );

      }

      else {

        alert(

          "Could not get your location.\n\n" +

          "Please try again."

        );

      }

    },


    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}


/* =================================
   SEARCH LOCATION
================================= */

async function searchPlace() {

  const query =

    document

      .getElementById("searchBox")

      .value

      .trim();


  if (!query) {

    alert("Enter a place name.");

    return;

  }


  try {

    const url =

      "https://nominatim.openstreetmap.org/search" +

      "?format=json" +

      "&limit=1" +

      "&countrycodes=in" +

      "&q=" +

      encodeURIComponent(query);


    const response =

      await fetch(url);


    const data =

      await response.json();


    if (!data.length) {

      alert("Location not found.");

      return;

    }


    const lat =

      parseFloat(data[0].lat);


    const lon =

      parseFloat(data[0].lon);


    map.flyTo(

      [lat, lon],

      15,

      {

        duration: 1.3

      }

    );


    L.popup()

      .setLatLng([lat, lon])

      .setContent(

        "<b>" +

        data[0].display_name +

        "</b>"

      )

      .openOn(map);

  }


  catch (error) {

    alert(

      "Search temporarily unavailable."

    );

  }

}


/* =================================
   ENTER KEY SEARCH
================================= */

document

  .getElementById("searchBox")

  .addEventListener(

    "keydown",

    function(event) {

      if (event.key === "Enter") {

        searchPlace();

      }

    }

  );


</script>

</body>
</html>
