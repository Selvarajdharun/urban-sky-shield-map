b<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Urban Sky Shield</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================
   BASIC
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
}


/* =========================
   TOP PANEL
========================= */

.top-panel {

  position: absolute;

  z-index: 2000;

  top: 8px;

  left: 8px;

  right: 8px;

  max-width: 720px;

  margin: auto;
}


.title-box {

  background: rgba(255,255,255,0.97);

  padding: 10px 14px;

  border-radius: 16px;

  box-shadow:
    0 3px 14px rgba(0,0,0,0.25);

  margin-bottom: 7px;
}


.title {

  font-size: 21px;

  font-weight: bold;

  color: #123b4a;
}


/* =========================
   SEARCH
========================= */

.search-row {

  display: flex;

  gap: 7px;
}


.search-row input {

  flex: 1;

  min-width: 0;

  height: 46px;

  border: none;

  border-radius: 14px;

  padding: 0 15px;

  font-size: 15px;

  outline: none;

  box-shadow:
    0 3px 13px rgba(0,0,0,0.25);
}


.search-btn,
.location-btn {

  height: 46px;

  border: none;

  border-radius: 14px;

  padding: 0 15px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 3px 13px rgba(0,0,0,0.25);
}


.search-btn {

  background: #087f9b;

  color: white;
}


.location-btn {

  background: white;

  color: #075c73;
}


/* =========================
   CUSTOM RIGHT ICONS
========================= */

.map-icons {

  position: absolute;

  z-index: 2000;

  right: 12px;

  top: 155px;

  display: flex;

  flex-direction: column;

  gap: 9px;
}


.map-icon {

  width: 48px;

  height: 48px;

  border: none;

  border-radius: 15px;

  background: #09233a;

  color: white;

  font-size: 22px;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.35);

  cursor: pointer;
}


.map-icon:active {

  transform: scale(0.94);
}


/* =========================
   MY LOCATION
========================= */

.locate-control {

  position: absolute;

  z-index: 2000;

  right: 12px;

  bottom: 25px;
}


.locate-big {

  width: 58px;

  height: 58px;

  border: none;

  border-radius: 18px;

  background: white;

  color: #1769ff;

  font-size: 29px;

  cursor: pointer;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.30);
}


/* =========================
   GPS BLUE DOT
========================= */

.user-dot {

  width: 22px;

  height: 22px;

  background: #1769ff;

  border: 4px solid white;

  border-radius: 50%;

  box-shadow:

    0 0 0 6px
    rgba(23,105,255,0.20),

    0 3px 12px
    rgba(0,0,0,0.40);
}


/* =========================
   ZOOM
========================= */

.leaflet-control-zoom {

  margin-top: 155px !important;

  margin-left: 8px !important;
}


.leaflet-control-zoom a {

  width: 42px !important;

  height: 42px !important;

  line-height: 42px !important;

  font-size: 25px !important;

  background: white !important;

  color: #123b4a !important;
}


/* =========================
   POPUP
========================= */

.location-popup {

  min-width: 190px;

  font-family: Arial, sans-serif;
}


.location-popup .heading {

  font-size: 16px;

  font-weight: bold;

  color: #1769ff;

  margin-bottom: 7px;
}


.location-popup .street {

  font-size: 14px;

  font-weight: bold;

  color: #222;

  line-height: 1.45;
}


.location-popup .accuracy {

  margin-top: 6px;

  font-size: 11px;

  color: #666;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

  .title {

    font-size: 18px;
  }


  .search-row {

    flex-wrap: wrap;
  }


  .search-row input {

    width: 100%;

    flex: none;
  }


  .search-btn,
  .location-btn {

    flex: 1;
  }


  .map-icons {

    top: 160px;

    right: 9px;
  }


  .map-icon {

    width: 45px;

    height: 45px;
  }

}

</style>

</head>


<body>


<!-- =========================
     MAP
========================= -->

<div id="map"></div>


<!-- =========================
     TOP
========================= -->

<div class="top-panel">


  <div class="title-box">

    <div class="title">

      🌌 URBAN SKY SHIELD

    </div>

  </div>


  <div class="search-row">


    <input
      id="searchBox"
      type="text"
      placeholder="Search Chennai, Madurai, Ooty..."
    >


    <button
      class="search-btn"
      onclick="searchPlace()"
    >

      SEARCH

    </button>


    <button
      class="location-btn"
      onclick="startLocation()"
    >

      📍 LOCATION

    </button>


  </div>

</div>


<!-- =========================
     MAP ICONS
========================= -->

<div class="map-icons">


  <button
    class="map-icon"
    onclick="toggleLayers()"
    title="Map layers"
  >
    🗺️
  </button>


  <button
    class="map-icon"
    onclick="togglePollution()"
    title="Light pollution"
  >
    🌈
  </button>


  <button
    class="map-icon"
    onclick="startLocation()"
    title="My location"
  >
    ⦿
  </button>


  <button
    class="map-icon"
    onclick="toggleSatellite()"
    title="Satellite"
  >
    🛰️
  </button>

</div>


<!-- =========================
     MY LOCATION
========================= -->

<div class="locate-control">

  <button
    class="locate-big"
    onclick="startLocation()"
    title="My Location"
  >

    📍

  </button>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   MAP
===================================================== */

const map = L.map("map", {

  zoomControl: true,

  minZoom: 5,

  maxZoom: 19

}).setView(

  [11.1271, 78.6569],

  7

);


/* =====================================================
   NORMAL DETAILED STREET MAP
===================================================== */

const streetMap = L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap contributors"

  }

);


streetMap.addTo(map);


/* =====================================================
   SATELLITE
===================================================== */

const satelliteMap = L.tileLayer(

  "https://server.arcgisonline.com/ArcGIS/rest/services/" +
  "World_Imagery/MapServer/tile/{z}/{y}/{x}",

  {

    maxZoom: 19,

    attribution:
      "&copy; Esri"

  }

);


/* =====================================================
   LIGHT POLLUTION
===================================================== */

const pollutionGroup = L.layerGroup();


const cities = [

  {
    name: "Chennai",
    lat: 13.0827,
    lon: 80.2707,
    color: "#ff3030",
    radius: 22000
  },

  {
    name: "Coimbatore",
    lat: 11.0168,
    lon: 76.9558,
    color: "#ff8c00",
    radius: 15000
  },

  {
    name: "Madurai",
    lat: 9.9252,
    lon: 78.1198,
    color: "#ff8c00",
    radius: 14000
  },

  {
    name: "Tiruchirappalli",
    lat: 10.7905,
    lon: 78.7047,
    color: "#ffc107",
    radius: 12000
  },

  {
    name: "Salem",
    lat: 11.6643,
    lon: 78.1460,
    color: "#ffc107",
    radius: 12000
  },

  {
    name: "Vellore",
    lat: 12.9165,
    lon: 79.1325,
    color: "#ffc107",
    radius: 10000
  },

  {
    name: "Tirunelveli",
    lat: 8.7139,
    lon: 77.7567,
    color: "#2ecc71",
    radius: 9000
  },

  {
    name: "Ooty",
    lat: 11.4102,
    lon: 76.6950,
    color: "#2ecc71",
    radius: 7000
  },

  {
    name: "Thanjavur",
    lat: 10.7870,
    lon: 79.1378,
    color: "#ffc107",
    radius: 8000
  }

];


cities.forEach(function(city) {


  L.circle(

    [city.lat, city.lon],

    {

      radius: city.radius,

      color: city.color,

      fillColor: city.color,

      fillOpacity: 0.13,

      weight: 2

    }

  )

  .bindPopup(

    "<b>" +
    city.name +
    "</b><br><br>" +

    "<small>" +
    "Light-pollution planning visualization" +
    "</small>"

  )

  .addTo(pollutionGroup);

});


/* SHOW POLLUTION BY DEFAULT */

pollutionGroup.addTo(map);


/* =====================================================
   GPS VARIABLES
===================================================== */

let userMarker = null;

let accuracyCircle = null;

let locationWatch = null;

let firstGPSFix = false;


/* =====================================================
   START GPS
===================================================== */

function startLocation() {


  if (!navigator.geolocation) {

    alert(
      "Your browser does not support GPS location."
    );

    return;

  }


  /* STOP OLD GPS WATCH */

  if (locationWatch !== null) {

    navigator.geolocation.clearWatch(
      locationWatch
    );

  }


  firstGPSFix = false;


  /* START HIGH ACCURACY GPS */

  locationWatch =

  navigator.geolocation.watchPosition(

    function(position) {


      const lat =
        position.coords.latitude;


      const lon =
        position.coords.longitude;


      const accuracy =
        position.coords.accuracy;


      console.log(
        "GPS LOCATION:",
        lat,
        lon,
        "ACCURACY:",
        accuracy
      );


      /* =========================
         REMOVE OLD MARKER
      ========================= */

      if (userMarker !== null) {

        map.removeLayer(
          userMarker
        );

      }


      /* =========================
         REMOVE OLD CIRCLE
      ========================= */

      if (accuracyCircle !== null) {

        map.removeLayer(
          accuracyCircle
        );

      }


      /* =========================
         BLUE GPS DOT
      ========================= */

      userMarker =

      L.marker(

        [lat, lon],

        {

          icon: L.divIcon({

            className: "",

            html:
              '<div class="user-dot"></div>',

            iconSize: [22,22],

            iconAnchor: [11,11]

          })

        }

      ).addTo(map);


      /* =========================
         ACCURACY CIRCLE
      ========================= */

      accuracyCircle =

      L.circle(

        [lat, lon],

        {

          radius: accuracy,

          color: "#1769ff",

          fillColor: "#1769ff",

          fillOpacity: 0.08,

          weight: 2

        }

      ).addTo(map);


      /* =========================
         FIRST FIX
      ========================= */

      if (!firstGPSFix) {

        firstGPSFix = true;


        map.flyTo(

          [lat, lon],

          18,

          {

            duration: 1.5

          }

        );

      }


      /* =========================
         GET STREET
      ========================= */

      getStreetName(

        lat,
        lon,
        accuracy

      );

    },


    function(error) {


      if (error.code === 1) {

        alert(

          "Location permission denied.\n\n" +

          "Browser Settings → Site permissions → " +

          "Location → Allow.\n\n" +

          "Also keep Precise Location ON."

        );

      }


      else if (error.code === 2) {

        alert(

          "Location unavailable.\n\n" +

          "Please turn ON phone GPS/Location."

        );

      }


      else {

        alert(

          "GPS timeout.\n\n" +

          "Please try again in an open area."

        );

      }

    },


    {

      enableHighAccuracy: true,

      timeout: 30000,

      maximumAge: 0

    }

  );

}


/* =====================================================
   STREET NAME
===================================================== */

async function getStreetName(

  lat,
  lon,
  accuracy

) {


  try {


    const url =

      "https://nominatim.openstreetmap.org/reverse" +

      "?format=json" +

      "&lat=" +
      encodeURIComponent(lat) +

      "&lon=" +
      encodeURIComponent(lon) +

      "&zoom=18" +

      "&addressdetails=1";


    const response =
      await fetch(url);


    const data =
      await response.json();


    const address =
      data.address || {};


    const road =

      address.road ||

      address.pedestrian ||

      address.residential ||

      address.footway ||

      address.path ||

      "Street name unavailable";


    const area =

      address.suburb ||

      address.neighbourhood ||

      address.village ||

      address.town ||

      "";


    const city =

      address.city ||

      address.town ||

      address.municipality ||

      address.village ||

      "";


    let text = road;


    if (area) {

      text +=
        "<br>" + area;

    }


    if (
      city &&
      city !== area
    ) {

      text +=
        "<br>" + city;

    }


    if (userMarker) {

      userMarker.bindPopup(

        '<div class="location-popup">' +

        '<div class="heading">' +
        '📍 You are here' +
        '</div>' +

        '<div class="street">' +
        text +
        '</div>' +

        '<div class="accuracy">' +
        'GPS accuracy: approximately ' +
        Math.round(accuracy) +
        ' m' +
        '</div>' +

        '</div>'

      ).openPopup();

    }


  }

  catch(error) {


    if (userMarker) {

      userMarker.bindPopup(

        '<div class="location-popup">' +

        '<div class="heading">' +
        '📍 You are here' +
        '</div>' +

        '<div class="street">' +
        'Street name unavailable' +
        '</div>' +

        '<div class="accuracy">' +
        'GPS accuracy: approximately ' +
        Math.round(accuracy) +
        ' m' +
        '</div>' +

        '</div>'

      ).openPopup();

    }

  }

}


/* =====================================================
   POLLUTION ON / OFF
===================================================== */

let pollutionVisible = true;


function togglePollution() {


  if (pollutionVisible) {

    map.removeLayer(
      pollutionGroup
    );

    pollutionVisible = false;

  }

  else {

    pollutionGroup.addTo(map);

    pollutionVisible = true;

  }

}


/* =====================================================
   SATELLITE ON / OFF
===================================================== */

let satelliteVisible = false;


function toggleSatellite() {


  if (!satelliteVisible) {

    map.removeLayer(
      streetMap
    );

    satelliteMap.addTo(map);

    satelliteVisible = true;

  }

  else {

    map.removeLayer(
      satelliteMap
    );

    streetMap.addTo(map);

    satelliteVisible = false;

  }

}


/* =====================================================
   LAYERS BUTTON
===================================================== */

function toggleLayers() {


  alert(

    "🗺️ MAP OPTIONS\n\n" +

    "🌈 = Light Pollution ON/OFF\n" +

    "🛰️ = Satellite / Street Map\n" +

    "⦿ = Current Location"

  );

}


/* =====================================================
   SEARCH
===================================================== */

async function searchPlace() {


  const query =

    document
      .getElementById("searchBox")
      .value
      .trim();


  if (!query) {

    alert(
      "Enter a place name."
    );

    return;

  }


  try {


    const url =

      "https://nominatim.openstreetmap.org/search" +

      "?format=json" +

      "&limit=1" +

      "&countrycodes=in" +

      "&q=" +

      encodeURIComponent(query);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (!data.length) {

      alert(
        "Location not found."
      );

      return;

    }


    const lat =
      parseFloat(data[0].lat);


    const lon =
      parseFloat(data[0].lon);


    map.flyTo(

      [lat, lon],

      17,

      {

        duration: 1.3

      }

    );


    L.popup()

      .setLatLng([lat, lon])

      .setContent(

        "<b>" +
        data[0].display_name +
        "</b>"

      )

      .openOn(map);


  }

  catch(error) {

    alert(
      "Search temporarily unavailable."
    );

  }

}


/* =====================================================
   ENTER TO SEARCH
===================================================== */

document

  .getElementById("searchBox")

  .addEventListener(

    "keydown",

    function(event) {

      if (event.key === "Enter") {

        searchPlace();

      }

    }

  );

</script>

</body>

      </html>
